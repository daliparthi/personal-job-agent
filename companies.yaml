# Career sites to search. Every Workday URL below was verified against the live Workday API on 2026-09-30 or
# 2026-10-04, and the other job boards (at the end) on 2026-10-04.
#
# Add any company that uses Workday: open its careers page, copy the URL (it looks like
# https://<company>.wd<N>.myworkdayjobs.com/<SiteName>), and add an entry - or use the
# 'Add company' box in Settings > Companies, which checks the URL first (it saves to your my_companies.yaml).
# Greenhouse, Lever, Ashby and SmartRecruiters boards work the same way; their URLs look like
#   https://job-boards.greenhouse.io/<board>   https://jobs.lever.co/<board>
#   https://jobs.ashbyhq.com/<board>           https://jobs.smartrecruiters.com/<company>
#   ats: + board:    -> for a careers page on the company's own domain that is powered by one of those boards,
#                       e.g.  url: https://careers.airbnb.com/   ats: greenhouse   board: airbnb
#   enabled: false   -> keep the entry but skip it
#   aliases: [...]   -> other names the company goes by (used for the current-employer exclusion)
# Your current employer (Settings > Current employer) is skipped automatically.
# A URL that isn't a supported career site shows up in red in Settings > Companies and in the search Log.

