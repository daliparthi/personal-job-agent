<!doctype html>
<html><head><meta charset="utf-8"><title>Voluntary Disclosures</title></head>
<body>
<!-- An anonymized, hand-built page in the shape of Workday's "Voluntary Disclosures" step. -->
<h2>Voluntary Disclosures</h2>
<div data-automation-id="formField-gender">
  <label for="gender">Gender<abbr title="required">*</abbr></label>
  <button type="button" id="gender" aria-haspopup="listbox" data-automation-id="gender" data-options="Female|Male|I do not wish to answer">Select One</button>
</div>
<div data-automation-id="formField-ethnicity">
  <label for="ethnicity">Please select your ethnicity<abbr title="required">*</abbr></label>
  <button type="button" id="ethnicity" aria-haspopup="listbox" data-automation-id="ethnicityDropdown" data-options="Asian|Black or African American|Hispanic or Latino|White|Two or More Races|I do not wish to answer">Select One</button>
</div>
<div data-automation-id="formField-veteranStatus">
  <label for="veteran">Veteran Status<abbr title="required">*</abbr></label>
  <button type="button" id="veteran" aria-haspopup="listbox" data-automation-id="veteranStatus" data-options="I am not a protected veteran|I identify as one or more of the classifications of protected veteran|I do not wish to self-identify">Select One</button>
</div>
<div data-automation-id="formField-agreementCheckbox">
  <input type="checkbox" id="terms" data-automation-id="agreementCheckbox">
  <label for="terms">I have read and consent to the terms and conditions<abbr title="required">*</abbr></label>
</div>
<button type="button" data-automation-id="bottom-navigation-next-button">Save and Continue</button>
<script src="common.js"></script>
</body></html>
