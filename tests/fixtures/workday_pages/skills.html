<!doctype html>
<html><head><meta charset="utf-8"><title>My Experience</title></head>
<body>
<!-- An anonymized, hand-built page in the shape of Workday's "Type to Add Skills" box, as it behaves on a real form:
     Enter searches; the last search's list stays on screen until the results arrive (about half a second) and is then
     drawn again once more as the rest come in; each suggestion is a row with a checkbox and a label, and the list
     stays open. A suggestion is picked by pressing the mouse button on it and letting go (Workday's rows don't answer
     a bare scripted click); that ticks it and shows it as a chip in the field and in the list. The chips are marked as
     options too. A click on the last search's list, while the new search is loading, is lost; after a pick the cursor
     goes back into the box. A search with no match shows "No Items." Some searches are slow (as on a real form,
     2.5 to 3.5 seconds): the list empties while they load, and their results come in late. A search with only one
     result adds it by itself. Results include near misses, as Workday's do ("Jet Skis" for SSIS). -->
<h2>My Experience</h2>

<div data-automation-id="formField-skills">
  <label for="skills">Type to Add Skills</label>
  <ul id="chips" role="listbox" data-automation-id="selectedItemList"></ul>
  <input type="text" id="skills" data-automation-id="searchBox">
</div>
<div id="popup" data-automation-id="activeListContainer" role="listbox" aria-multiselectable="true"></div>

<script>
const RESULTS = {
  "etl development": ["ETL Development", "ETL Tools", "Data Transformation"],
  "data transformation": ["Data Transformation", "Data Center Transformation", "Data Transformation Services (DTS)",
                          "Data Conversions"],
  "fine tuning": ["Fine-Tuning", "Model Fine-Tuning"],
  "data cataloging": ["Data Cataloging", "Data Catalogs"],
  "python": ["Python (Programming Language)", "Python Scripting"],
  "sql": ["SQL", "SQL Server"],
  "snowflake": ["Snowflake", "Snowflake Schema"],
  "tableau": ["Tableau (Software)"],
  "power bi": ["Microsoft Power Business Intelligence (PBI)", "Microsoft Copilot for Power BI", "Power PCB",
               "Microsoft Power Business Intelligence (BI) Desktop"],
  "data governance": ["Data Governance", "Data Governance Frameworks"],
  "data quality management": ["Data Quality Management", "Data Quality Management Systems"],
  "data pipelines": ["Data Pipeline", "Data Pipeline Automation"],
  "collaboration": ["Collaboration", "Team Collaboration", "Peer Collaboration", "Work Collaboratively"],
  "mcp tools": ["mcp tools"],
  "oracle": ["Oracle Database", "Oracle GL", "Oracle SQL", "Oracle VM"],
  "sql server": ["Microsoft SQL Server", "SQL Server BI", "SQL Server SSAS", "Microsoft SQL Database"],
  "ssis": ["KingswaySoft SSIS", "Jet Skis", "SQL Server Integration Services (SSIS)", "SSAS Tabular"],
  "azure": ["Azure Local", "Microsoft Azure", "Azure DevOps"],
  "unix/linux": ["Linux", "Unix Programming", "Unix Systems", "Unix Shell"],
  "unix": ["Unix", "Unix Shell"],
  "linux": ["Linux", "Linux Programming"],
  "llm applications": ["LLM Evaluation", "CRM Applications", "Loan Applications", "LLM Architecture"],
};
// how long a search takes (ms); the rest take half a second
const SLOW = { "collaboration": 2600, "data governance": 3200, "mcp tools": 2500, "oracle": 2800, "ssis": 3500,
               "unix/linux": 2600, "llm applications": 2600 };
const selected = [];
let search = 0;  // the latest search; a click on an older search's list does nothing

function chipItems() {
  return selected.map((name) => {
    const li = document.createElement("li");
    const chip = document.createElement("div");
    chip.setAttribute("role", "option");
    chip.dataset.automationId = "selectedItem";
    const label = document.createElement("div");
    label.dataset.automationId = "promptOption";
    label.textContent = name;
    chip.appendChild(label);
    const del = document.createElement("div");
    del.setAttribute("role", "button");
    del.dataset.automationId = "DELETE_charm";
    li.append(chip, del);
    return li;
  });
}

function draw(names, g) {
  const popup = document.getElementById("popup");
  popup.innerHTML = "";
  if (!names.length) {
    popup.textContent = "No Items.";
    return;
  }
  for (const name of names) {
    const row = document.createElement("div");
    row.setAttribute("role", "option");
    row.dataset.automationId = "menuItem";
    const leaf = document.createElement("div");
    leaf.dataset.automationId = "promptLeafNode";
    const panel = document.createElement("div");
    panel.dataset.automationId = "checkboxPanel";
    const box = document.createElement("input");
    box.type = "checkbox";
    box.checked = selected.includes(name);
    panel.appendChild(box);
    const label = document.createElement("div");
    label.dataset.automationId = "promptOption";
    label.dataset.automationLabel = name;
    label.textContent = name;
    leaf.append(panel, label);
    row.appendChild(leaf);
    let pressed = false;
    leaf.addEventListener("mousedown", (e) => { e.preventDefault(); pressed = true; });
    leaf.addEventListener("mouseup", () => {
      if (!pressed || !row.isConnected || g !== search) return;
      pressed = false;
      const i = selected.indexOf(name);
      if (i >= 0) selected.splice(i, 1); else selected.push(name);
      box.checked = i < 0;
      drawChips();
      document.getElementById("skills").focus();  // Workday puts the cursor back in the box (a trusted focus event)
    });
    leaf.addEventListener("click", (e) => e.preventDefault());  // the checkbox follows the pick, not the click
    popup.appendChild(row);
  }
  const list = document.createElement("ul");
  list.dataset.automationId = "selectedItemList";
  list.append(...chipItems());
  popup.appendChild(list);
}

function drawChips() {
  document.getElementById("chips").replaceChildren(...chipItems());
  const list = document.querySelector('#popup [data-automation-id="selectedItemList"]');
  if (list) list.replaceChildren(...chipItems());
}

document.getElementById("skills").addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  const q = e.target.value.trim().toLowerCase();
  const names = RESULTS[q] || [];
  const g = ++search;
  const wait = SLOW[q] || 500;
  if (SLOW[q]) setTimeout(() => { if (g === search) document.getElementById("popup").innerHTML = ""; }, 300);
  setTimeout(() => {                       // the results arrive (a slow search's even after the next one started)...
    draw(names, g);
    if (names.length === 1 && !selected.includes(names[0])) {  // ...the only one is added by itself...
      selected.push(names[0]);
      draw(names, g);
      drawChips();
    }
  }, wait);
  setTimeout(() => draw(names, g), wait + 300);   // ...and the list is drawn again as the rest come in
});
</script>
<script src="common.js"></script>
</body>
</html>
