<!doctype html>
<html><head><meta charset="utf-8"><title>Application Questions</title></head>
<body>
<!-- An anonymized, hand-built page in the shape of Workday's "Application Questions" step. -->
<h2>Application Questions</h2>
<div data-automation-id="formField-q1">
  <label for="q1">Are you legally authorized to work in the United States?<abbr title="required">*</abbr></label>
  <button type="button" id="q1" aria-haspopup="listbox" data-options="Yes|No">Select One</button>
</div>
<div data-automation-id="formField-q2">
  <label for="q2">Will you now or in the future require sponsorship for employment visa status?<abbr title="required">*</abbr></label>
  <button type="button" id="q2" aria-haspopup="listbox" data-options="Yes|No">Select One</button>
</div>
<div data-automation-id="formField-q3">
  <label for="q3">What are your salary expectations?<abbr title="required">*</abbr></label>
  <textarea id="q3"></textarea>
</div>
<div data-automation-id="formField-q4">
  <label for="q4">Are you willing to relocate?<abbr title="required">*</abbr></label>
  <button type="button" id="q4" aria-haspopup="listbox" data-options="Yes|No|Open to discussion">Select One</button>
</div>
<div data-automation-id="formField-q5">
  <label for="q5">Why do you want to work at Acme?</label>
  <textarea id="q5"></textarea>
</div>
<fieldset data-automation-id="formField-q6">
  <legend>Do you have a non-compete agreement with a current employer?<abbr title="required">*</abbr></legend>
  <input type="radio" name="q6" id="q6-yes" value="Yes"><label for="q6-yes">Yes</label>
  <input type="radio" name="q6" id="q6-no" value="No"><label for="q6-no">No</label>
</fieldset>
<div data-automation-id="formField-q7">
  <label for="q7">How many years of Python experience do you have?<abbr title="required">*</abbr></label>
  <input type="text" id="q7">
</div>
<div data-automation-id="formField-q8">
  <label for="q8">Are you legally authorized to work in Canada?</label>
  <textarea id="q8"></textarea>
</div>
<button type="button" data-automation-id="bottom-navigation-next-button">Save and Continue</button>
<script src="common.js"></script>
</body></html>
